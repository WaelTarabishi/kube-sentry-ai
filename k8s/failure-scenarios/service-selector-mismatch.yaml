apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-demo
  namespace: k8s-agent-failure-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-demo
  template:
    metadata:
      labels:
        app: selector-demo
        failure-scenario: service-selector-mismatch
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: selector-demo
  namespace: k8s-agent-failure-lab
spec:
  # Intentionally wrong: the pod label is app=selector-demo.
  selector:
    app: selector-demo-wrong
  ports:
    - name: http
      port: 80
      targetPort: http
